function buildPdf(pages){const N=pages.length;if(!N)throw new Error('ملف فارغ');

  if(a==='bon'||a==='pap'||a==='papx'||a==='shimg'||a==='shpdf'){ld('purchases');ld('bonuses')}
  if(a==='prod')push(vProd(id));else if(a==='inv')push(vInv(id));else if(a==='sup')push(vSup(id));
  else if(a==='bon')push(vBon(id));else if(a==='pap')push(vPap(id));
  else if(a==='back'){stack.pop();show()}
  else if(a==='per'){per=+id;rRep()}else if(a==='mr'){lim_.r=40;rRep()}
  else if(a==='ms'){lim_.s+=60;rStk()}else if(a==='mp'){lim_.p+=30;rPur()}
  else if(a==='bpf'){bp=id;document.querySelectorAll('[data-a=bpf]').forEach(b=>b.classList.toggle('on',b===t));blim=25;rBns()}
  else if(a==='bmr'){blim+=40;rBns()}
  else if(a==='flt'){flt=id;document.querySelectorAll('[data-a=flt]').forEach(b=>b.classList.toggle('on',b===t));lim_.s=40;rStk()}
  else if(a==='go')$('#'+id).scrollIntoView({behavior:'smooth',block:'start'});
  else if(a==='zoom')t.classList.toggle('z');
  else if(a==='tab')gt(id);
  else if(a==='ig'){const l=ign(),i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);setIgn(l);NEED.forEach(x=>x.ig=l.includes(x.p._k));NEED.sort(ns);rNeed()}
  else if(a==='shimg')invImgs(id)
  else if(a==='shpdf')invPdf(id)
   else if(a==='papx')exportPap(id)
  else if(a==='vpap')viewPap(id)
  else if(a==='fvc'){$('#fv').classList.remove('on');$('#fvb').innerHTML=''}});
$('#qs').oninput=e=>{qs=e.target.value;lim_.s=40;rStk()};
$('#qp').oninput=e=>{qp=e.target.value;lim_.p=15;rPur()};
$('#qb').oninput=e=>{bs=e.target.value;blim=25;rBns()};

  let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();
  if(n-lastTap<300&&e.cancelable&&!e.target.closest('input,textarea'))e.preventDefault();
  lastTap=n},{passive:false});
/* الاتصال الحي */
const LD={},ERR=[];let CONN=0;
const rsn=e=>{const m=String((e&&(e.code||e.message))||e||'');if(ERR.indexOf(m)<0)ERR.push(m);mark()};
const ld=c=>{if(LD[c])return;LD[c]=1;db.ref('pos/'+c).on('value',s=>{S[c]=s.val()||{};LD[c]=2;mark()},rsn)};
db.ref('.info/connected').on('value',s=>{CONN=s.val()===true?1:0});
const TB=['st','su','nd','pu','bn','sk'],N=TB.length,VP=$('.vp'),TK=$('.trk'),TBN=$('.tb'),BT=[...TBN.querySelectorAll('button')],PGS=[...TK.children],IND=document.createElement('i');
let cT='st',P=0,V=0,BZ=0,PD=0,tg=0,raf=0,hs=[],x0=0,y0=0,p0=0,lk=0,gb=0,W=1,cK=0;
IND.className='ind';TBN.prepend(IND);
const rbd=o=>1-1/(o*.55+1),cl=x=>x<0?-rbd(-x):x>N-1?N-1+rbd(x-N+1):x;
const SLOT=100/N;
function ap(x){P=x;const c=cl(x),k=Math.round(Math.min(Math.max(x,0),N-1));
  TK.style.transform='translate3d('+c*SLOT+'%,0,0)';IND.style.transform='translate3d('+(-c*100)+'%,0,0)';
  if(k!==cK){cK=k;BT.forEach((b,i)=>b.classList.toggle('on',i===k))}}
function done(){BZ=0;if(PD){PD=0;all()}}
function go(t){t=Math.max(0,Math.min(N-1,t));tg=t;cT=TB[t];cancelAnimationFrame(raf);BZ=1;
  if(t===1||t===3){ld('purchases');ld('payments')}
  if(t===4){ld('bonuses');ld('purchases')}
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){V=0;ap(t);return done()}
  const w=15,A=P-t,B=V+w*A,s0=performance.now();
  const st=n=>{const s=Math.max(0,(n-s0)/1000),e=Math.exp(-w*s),x=t+(A+B*s)*e,v=(B-w*(A+B*s))*e;
    if(s>1.5||(Math.abs(x-t)<5e-4&&Math.abs(v)<.01)){V=0;ap(t);return done()}
    V=v;ap(x);raf=requestAnimationFrame(st)};
  raf=requestAnimationFrame(st)}
function gt(id){const i=TB.indexOf(id);if(i<0)return;if(i===tg&&!BZ){PGS[i].scrollTo({top:0,behavior:'smooth'});return}go(i)}
VP.addEventListener('touchstart',e=>{if(stack.length||e.touches.length>1)return;const t=e.touches[0];
  x0=t.clientX;y0=t.clientY;lk=0;W=VP.clientWidth||1;gb=BZ?1:0;if(BZ)cancelAnimationFrame(raf);
  p0=P;V=0;hs=[[performance.now(),P]]},{passive:true});
VP.addEventListener('touchmove',e=>{if(!hs.length||lk===2)return;const t=e.touches[0];
  if(!lk){const a=Math.abs(t.clientX-x0),b=Math.abs(t.clientY-y0);if(a<7&&b<7)return;
    if(a>b){lk=1;BZ=1;x0=t.clientX;p0=P;TK.classList.add('dg')}else{lk=2;return}}
  const n=performance.now(),p=p0+(t.clientX-x0)/W;ap(p);hs.push([n,p]);while(hs.length>2&&n-hs[0][0]>100)hs.shift()},{passive:true});
function fin(){TK.classList.remove('dg');
  if(lk===1){const n=performance.now(),h=hs[0],l=hs[hs.length-1],dt=(l[0]-h[0])/1000,
      v=n-l[0]<90&&dt>.008?(l[1]-h[1])/dt:0,b=Math.round(p0);
    V=v;go(Math.max(b-1,Math.min(b+1,Math.round(P+v*.2))))}
  else if(gb)go(tg);
  hs=[];lk=0;gb=0}
VP.addEventListener('touchend',fin,{passive:true});VP.addEventListener('touchcancel',fin,{passive:true});
let tm,first=true,FORCE=0;
setTimeout(()=>{FORCE=1;mark()},8000);
function intro(){if(matchMedia('(prefers-reduced-motion:reduce)').matches||!Element.prototype.animate)return;
  [...$('#rep').children].forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:700,delay:i*70,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}))}
function rSks(){const L=Object.values(PM),z=L.filter(p=>(+p.stockBase||0)<=0).length,lo=L.filter(p=>(+p.stockBase||0)>0&&(+p.stockBase||0)<=lim()*bf(p)).length,ok=L.length-z-lo,n=L.length||1;
  $('#sks').innerHTML=`<div class="g pad"><div class="stb"><i style="width:${ok/n*100}%;background:var(--gr)"></i><i style="width:${lo/n*100}%;background:var(--or)"></i><i style="width:${z/n*100}%;background:var(--rd)"></i></div><div class="ch"><span class="cg">متوفر ${ok}</span><span style="color:var(--or)">ناقص ${lo}</span><span class="cr">معدوم ${z}</span></div></div><div style="height:12px"></div>`}
function all(){if(BZ){PD=1;return}prep();rRep();rStk();rSks();rPur();rBns();rSup();if(stack.length)show(1);
  $('#dot').classList.add('on');$('#sy').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(S.settings&&S.settings.pharmacyName)$('#ttl').textContent=S.settings.pharmacyName;
  if(first&&LD.products===2&&(LD.sales===2||FORCE)){first=false;document.body.classList.add('rd');intro();$('#ld').classList.add('fd');setTimeout(()=>{const l=$('#ld');if(l)l.remove()},1000)}}
const mark=()=>{clearTimeout(tm);tm=setTimeout(all,150)};
function attach(){
  db.ref('pos/settings/app').on('value',s=>{S.settings=s.val();mark()});
  ld('products');ld('suppliers');ld('sales');
   setTimeout(()=>{ld('purchases');ld('payments');ld('bonuses')},2500);
}
const noData=()=>{const L=$('#ld');if(!L||LD.products===2)return;
  const why=ERR.length?ERR.join(' | '):(CONN?'الاتصال شغّال لكن pos/products فارغ في قاعدة البيانات':'لم يُفتح اتصال بقاعدة البيانات — سياسة CSP أو الشبكة تمنع النطاق');
  L.innerHTML='<div style="padding:24px;text-align:center"><div style="font-weight:700;margin-bottom:8px">لا توجد بيانات من السحابة</div><div class="mu" style="margin-bottom:14px;word-break:break-word">'+esc(why)+'</div><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'};
firebase.auth().onAuthStateChanged(u=>{if(u)attach()});
firebase.auth().signInAnonymously().catch(e=>{$('#ld').innerHTML='<div style="padding:24px;text-align:center;color:var(--rd)">تعذر الاتصال: '+esc(e.message)+'</div>'});
setTimeout(noData,12000);
</script>
</body>
</html>
