le{font-size:11.5px}th,td{padding:8px 4px}td:first-child{overflow-wrap:anywhere;font-weight:600} main{opacity:0;transition:opacity .7s ease;touch-action:pan-y pinch-zoom}.rd main{opacity:1}

<script>
'use strict';
firebase.initializeApp({
  apiKey:"AIzaSyCtz6MiAPW5I1BDNqJXMe-q8CgOrsEfC10",authDomain:"healingpath-51637.firebaseapp.com",
  databaseURL:"https://healingpath-51637-default-rtdb.europe-west1.firebasedatabase.app",projectId:"healingpath-51637",
  storageBucket:"healingpath-51637.firebasestorage.app",messagingSenderId:"247914857779",appId:"1:247914857779:web:1c0e49c02d3ce6f109aa46"
});
const db=firebase.database();
const S={products:{},sales:{},purchases:{},suppliers:{},payments:{},settings:null};
let per=7,flt='all',qs='',qp='',lim_={r:10,s:40,p:15},stack=[],PM={},PN={},D={},NEED=[];

/* أدوات */
const $=s=>document.querySelector(s),arr=o=>Object.values(o||{}).filter(x=>x&&!x.deleted);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=x=>(Math.round((+x||0)*100)/100).toLocaleString('en-US');
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dt=t=>new Date(t).toLocaleDateString('en-GB');
const cur=()=>(S.settings&&S.settings.currency)||'د.ع',lim=()=>(S.settings&&S.settings.lowStock)||10;
const bf=p=>(p.units||[]).reduce((a,u,i)=>i?a*(+u.perNext||1):a,1);
const un=p=>p&&p.units&&p.units.length?p.units[p.units.length-1].name:'وحدة';
const stk=p=>(+p.stockBase||0)/bf(p);
const prodOf=it=>PM[it.productId]||PN[it.name];
const bn=it=>+(it.bonus??it.bonusQty??it.free)||0;
const img=p=>{for(const k in p){if(/img|image|photo|pic|scan|paper|attach/i.test(k)){const v=Array.isArray(p[k])?p[k][0]:p[k];if(typeof v==='string'&&/^(data:image|https?:)/.test(v))return v}}return null};
const sum=(o,n)=>{let t=0;for(let i=0;i<n;i++)t+=o.days[dk(Date.now()-i*864e5)]||0;return t};
const tq=o=>Object.values(o.days).reduce((a,x)=>a+x,0),
  fdk=o=>Object.keys(o.days).sort()[0],
  nds=o=>Object.values(o.days).filter(x=>x>0).length,
  rt=o=>{const k=fdk(o);if(!k)return 0;const n=Math.max(1,Math.ceil((Date.now()-new Date(k+'T00:00:00').getTime())/864e5)||1);return tq(o)/n};

const lsd=o=>Object.keys(o.days).filter(k=>o.days[k]>0).sort().pop()||'1970-01-01',
  rn=o=>{const a=Math.max(1,Math.ceil((Date.now()-new Date(fdk(o)+'T00:00:00').getTime())/864e5)),w=Math.min(60,a);return sum(o,w)/w*.6+rt(o)*.4},
  ign=()=>{try{return JSON.parse(localStorage.getItem('ign')||'[]')}catch(e){return[]}},
  setIgn=l=>{try{localStorage.setItem('ign',JSON.stringify(l))}catch(e){}},
  ns=(a,b)=>(a.ig||a.alt)-(b.ig||b.alt)||a.dl-b.dl;
/* تجهيز البيانات */
function prep(){
  PM={};PN={};
  Object.entries(S.products||{}).forEach(([k,p])=>{if(p&&!p.deleted){p._k=p.id||k;PM[p._k]=p;PN[p.brandName]=p}});
  D={};
  arr(S.sales).forEach(s=>{const sg=s.type==='return'?-1:1,d=s.date||dk(s.ts);
    (s.items||[]).forEach(it=>{const p=prodOf(it),k=p?p._k:it.name;
      const o=D[k]||(D[k]={k,name:p?p.brandName:it.name,p,days:{}});
      o.days[d]=(o.days[d]||0)+sg*(+it.qtyBase||+it.qty||0)/(p?bf(p):1)})});
      const IG=ign(),sk=p=>(p.scientificName+'|'+(p.dose||'')).toLowerCase(),SK={};
  Object.values(PM).forEach(p=>{if(p.scientificName&&(+p.stockBase||0)>0)SK[sk(p)]=1});
  NEED=Object.values(PM).map(p=>{const o=D[p._k];if(!o||nds(o)<3||Date.now()-new Date(lsd(o)+'T00:00:00').getTime()>45*864e5)return null;
    const r=rn(o),s=stk(p);return{p,r,s,dl:s<=0?0:r>0?s/r:Infinity,ig:IG.includes(p._k),alt:s<=0&&!!p.scientificName&&!!SK[sk(p)]}})
    .filter(x=>x&&(x.s<=0||x.dl<=10)).sort(ns);
}

/* رسوم */
const COL=['#007aff','#34c759','#ff9500','#af52de','#ff2d55','#5ac8fa','#8e8e93'];
function donut(it,tot){const r=52,c=2*Math.PI*r;let o=0;
  return `<svg viewBox="0 0 140 140" class="dn"><g transform="rotate(-90 70 70)" fill="none" stroke-width="16">${it.map((x,i)=>{const l=x.v/tot*c,s=`<circle cx="70" cy="70" r="${r}" stroke="${COL[i]}" stroke-dasharray="${Math.max(l-2,.5)} ${c}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</g><text x="70" y="72" class="dv">${f(tot)}</text><text x="70" y="88" class="dl">إجمالي المسحوب</text></svg>`}
function bars(v){const m=Math.max(...v,1),w=300/v.length,n=v.length;
  return `<svg viewBox="0 0 300 90" style="width:100%">${v.map((x,i)=>{const h=x?Math.max(x/m*76,2):0;return `<rect x="${(n-1-i)*w+1}" y="${84-h}" width="${w-2}" height="${h}" rx="2" fill="var(--bl)" opacity="${i==n-1?1:.5}"/><rect x="${(n-1-i)*w+1}" y="84" width="${w-2}" height="1" fill="var(--ln)"/>`}).join('')}</svg><div class="ch"><span>اليوم</span><span>قبل ${n} يوماً</span></div>`}
function spark(v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),R=mx-mn||1,n=v.length;
  const pts=v.map((x,i)=>`${300-i*300/(n-1)},${70-(x-mn)/R*60}`).join(' ');
  return `<svg viewBox="0 0 300 80" style="width:100%"><polyline points="${pts}" fill="none" stroke="var(--bl)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

/* الصفحة الرئيسية */
function rTop(){
  const debt=arr(S.suppliers).reduce((x,s)=>x+(+s.debt||0),0),L=Object.values(PM),z=L.filter(p=>(+p.stockBase||0)<=0).length,td=Object.values(D).filter(o=>sum(o,1)>0).length;
  $('#top').innerHTML=`<button class="t" data-a="tab" data-id="su"><div class="k">ديون المجهزين</div><div class="x cr">${f(debt)}</div><div class="mu">${esc(cur())}</div></button>
  <button class="t" data-a="tab" data-id="nd"><div class="k">أصناف تحتاج طلب</div><div class="x" style="color:var(--or)">${NEED.length}</div><div class="mu">من ${L.length} صنف</div></button>
  <button class="t" data-a="tab" data-id="sk"><div class="k">أصناف معدومة</div><div class="x cr">${z}</div><div class="mu">رصيدها صفر</div></button>
  <div class="t"><div class="k">أصناف سُحبت اليوم</div><div class="x cg">${td}</div><div class="mu">صنف مختلف</div></div>`;
}
function rRep(){
  if(LD.sales!==2){$('#rep').innerHTML='<div class="g skl"></div><div class="g skl" style="margin-top:12px"></div>';return}
  const rows=Object.values(D).map(o=>({o,v:sum(o,per),r:rt(o)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const t6=rows.filter(x=>x.o.p&&stk(x.o.p)>0).slice(0,6).map(x=>({n:x.o.name,v:x.v})),tot=t6.reduce((a,x)=>a+x.v,0);
  const P=[[1,'اليوم'],[7,'7 أيام'],[30,'30 يوماً'],[90,'90 يوماً']];
  const dly=Array.from({length:14},(_,i)=>Object.values(D).reduce((a,o)=>a+(o.days[dk(Date.now()-i*864e5)]||0),0));
  $('#rep').innerHTML=`<div class="seg">${P.map(([v,l])=>`<button data-a="per" data-id="${v}" class="${per===v?'on':''}">${l}</button>`).join('')}</div>
  <div class="mu" style="margin:0 4px 8px">الأعلى سحباً من الأصناف المتوفرة بالمخزن</div>
  <div class="g">${t6.length?`<div class="r dr" style="gap:14px">${donut(t6,tot)}<div class="lg">${t6.map((x,i)=>`<div><i style="background:${COL[i]}"></i><span>${esc(x.n)}</span><b>${Math.round(x.v/tot*100)}%</b></div>`).join('')}</div></div>`:'<div class="pad mu">لا سحب في هذه الفترة</div>'}</div>
  <h2 style="font-size:18px">السحب اليومي (14 يوماً)</h2><div class="g pad">${bars(dly)}</div>
  <h2 style="font-size:18px">معدل الصرف اليومي</h2>
  <div class="g">${rows.slice(0,lim_.r).map((x,i)=>`<button class="r" data-a="prod" data-id="${esc(x.o.k)}"><span class="rk">${i+1}</span><div class="b"><div class="n">${esc(x.o.name)}</div><div class="mu">المخزون ${f(x.o.p?stk(x.o.p):0)} ${esc(un(x.o.p))} · سُحب ${f(x.v)} بالفترة</div></div><div class="rt"><b>${f(x.r)}</b><span>${esc(un(x.o.p))} / يوم</span></div></button>`).join('')}
  ${rows.length>lim_.r?`<button class="more" data-a="mr">عرض المزيد</button>`:''}</div>`;
  rNeed();
}
function rNeed(){
  $('#need').innerHTML=`<div class="mu" style="margin:0 4px 10px">أصناف تُباع بانتظام وأوشكت على النفاد · التغطية 30 يوماً · ✕ لتجاهل الصنف</div><div class="g">${NEED.slice(0,80).map(x=>{const sg=Math.ceil(x.r*30-x.s),c=x.dl<=3?'r':x.dl<=7?'o':'b',d=x.ig||x.alt;
    return `<div class="r nr${d?' dm':''}"><button class="nb" data-a="prod" data-id="${esc(x.p._k)}"><div class="b"><div class="n">${esc(x.p.brandName)}</div><div class="mu">الموجود ${f(x.s)} ${esc(un(x.p))} · ${x.r>0?'يكفي '+(x.dl<1?'أقل من يوم':f(Math.floor(x.dl))+' يوماً'):'بدون سحب'} · ${f(x.r)} يومياً</div></div>${x.ig?'<span class="pill p-b">متجاهَل</span>':x.alt?'<span class="pill p-g">يتوفر بديل</span>':sg>0?`<span class="pill p-${c}">اطلب ${f(sg)}</span>`:`<span class="pill p-${x.s<=0?'r':'o'}">${x.s<=0?'معدوم':'ناقص'}</span>`}</button><button class="xb" data-a="ig" data-id="${esc(x.p._k)}" aria-label="تجاهل">${x.ig?'↺':'✕'}</button></div>`}).join('')||'<div class="pad mu">لا نقوصات حالياً</div>'}</div>`;
}
function rStk(){
  const q=qs.trim().toLowerCase();
  let l=Object.values(PM);
  if(flt==='low')l=l.filter(p=>(+p.stockBase||0)<=lim()*bf(p));
  if(q)l=l.filter(p=>[p.brandName,p.scientificName,p.company,(p.barcodes||[]).join(' ')].join(' ').toLowerCase().includes(q));
  l.sort((a,b)=>String(a.brandName).localeCompare(String(b.brandName),'ar'));
  $('#stk').innerHTML=l.slice(0,lim_.s).map(p=>{const z=(+p.stockBase||0)<=0,lo=(+p.stockBase||0)<=lim()*bf(p);
    return `<button class="r" data-a="prod" data-id="${esc(p._k)}"><div class="b"><div class="n">${esc(p.brandName)}${p.dose?` <span class="mu">${esc(p.dose)}</span>`:''}</div><div class="mu">${esc(p.company||'')}</div></div><div class="v ${z?'cr':lo?'':''}" style="${lo&&!z?'color:var(--or)':''}">${f(stk(p))} <span class="mu">${esc(un(p))}</span></div></button>`}).join('')||'<div class="pad mu">لا نتائج</div>';
  if(l.length>lim_.s)$('#stk').insertAdjacentHTML('beforeend',`<button class="more" data-a="ms">عرض المزيد (${l.length-lim_.s})</button>`);
}
function purRow(p){return `<button class="r" data-a="inv" data-id="${esc(p.id)}"><div class="b"><div class="n">${esc(p.supplierName||'بدون مجهز')}</div><div class="mu">${dt(p.ts)} · قائمة ${esc(p.listNum??'—')} · ${(p.items||[]).length} مادة</div></div>${p.type==='return'?'<span class="pill p-r">استرجاع</span>':''}<span class="pill p-${p.pay==='credit'?'o':'g'}">${p.pay==='credit'?'آجل':'نقد'}</span><div class="v">${f(p.total)}</div></button>`}
function rPur(){
  const q=qp.trim().toLowerCase();
  let l=arr(S.purchases).sort((a,b)=>b.ts-a.ts);
  if(q)l=l.filter(p=>(p.supplierName||'').toLowerCase().includes(q)||String(p.listNum??'')===q||(p.items||[]).some(i=>(i.name||'').toLowerCase().includes(q)));
  $('#pur').innerHTML=l.slice(0,lim_.p).map(purRow).join('')||'<div class="pad mu">لا قوائم</div>';
  if(l.length>lim_.p)$('#pur').insertAdjacentHTML('beforeend',`<button class="more" data-a="mp">عرض المزيد</button>`);
}
function rSup(){
  $('#sup').innerHTML=arr(S.suppliers).sort((a,b)=>(+b.debt||0)-(+a.debt||0)).map(s=>`<button class="r" data-a="sup" data-id="${esc(s.id)}"><div class="b"><div class="n">${esc(s.name)}</div><div class="mu">${s.lastPurchase?'آخر شراء '+f(s.lastPurchase.amount)+' · '+dt(s.lastPurchase.ts):'لا مشتريات'}</div></div><div class="v ${(+s.debt||0)>0?'cr':'cg'}">${f(s.debt)}</div></button>`).join('')||'<div class="pad mu">لا مجهزين</div>';
}

/* النوافذ */
const hdr=()=>`<div class="hd"><button data-a="back">${stack.length>1?'رجوع ›':'إغلاق'}</button></div>`;
const tl=(k,x,s)=>`<div class="t"><div class="k">${k}</div><div class="x">${x}</div>${s?`<div class="mu">${s}</div>`:''}</div>`;
const vProd=id=>()=>{const p=PM[id];if(!p)return hdr()+'<div class="pad mu">الصنف غير موجود</div>';
    const o=D[id]||{days:{}},r=rt(o),s=stk(p),u=esc(un(p)),days=[];
  for(let i=29;i>=0;i--)days.push(o.days[dk(Date.now()-i*864e5)]||0);
  const B=[];arr(S.purchases).forEach(x=>(x.items||[]).forEach(it=>{if(prodOf(it)===p)B.push({x,it})}));B.sort((a,b)=>b.x.ts-a.x.ts);
  const L=B[0],base=p.units&&p.units.length>1?`${f(p.stockBase)} ${esc(p.units[0].name)}`:'';
  return hdr()+`<div style="font-size:26px;font-weight:700">${esc(p.brandName)} <span class="mu">${esc(p.dose||'')}</span></div>
  <div class="mu">${esc([p.company,p.scientificName].filter(Boolean).join(' · '))}</div>
  <div style="margin:18px 0 18px"><div class="mu">الموجود بالمخزن</div><div class="big">${f(s)} <span style="font-size:20px" class="mu">${u}</span></div><div class="mu">${base}</div></div>
  <div class="tiles">${tl('سُحب اليوم',f(sum(o,1)),u)}${tl('آخر 7 أيام',f(sum(o,7)),u)}${tl('آخر 30 يوماً',f(sum(o,30)),u)}${tl('يكفي لـ',r>0?(s<=0?'0':f(Math.floor(s/r))):'—',r>0?'يوماً · المعدل '+f(r)+' يومياً':'لا سحب')}</div>
  <h2 style="font-size:18px">السحب اليومي (30 يوماً)</h2><div class="g pad">${bars(days)}</div>
  <h2 style="font-size:18px">آخر شراء</h2>
  ${L?`<div class="g"><button class="r" data-a="inv" data-id="${esc(L.x.id)}"><div class="b"><div class="n">${esc(L.x.supplierName||'—')}</div><div class="mu">${dt(L.x.ts)} · سعر الشراء ${f(L.it.buyPrice)} ${esc(cur())}</div></div><div class="v">${f(L.it.qty)} ${esc(L.it.unitName||'')}<div class="${bn(L.it)?'cg':'mu'}" style="font-size:12px">بونص ${f(bn(L.it))}</div></div></button></div>`:'<div class="g pad mu">لا توجد مشتريات مسجلة</div>'}
  ${B.length>1?`<h2 style="font-size:18px">حركة الشراء</h2><div class="g">${B.slice(0,20).map(({x,it})=>`<button class="r" data-a="inv" data-id="${esc(x.id)}"><div class="b"><div class="n">${esc(x.supplierName||'—')}</div><div class="mu">${dt(x.ts)}${x.type==='return'?' · استرجاع':''} · ${f(it.buyPrice)}</div></div><div class="v">${f(it.qty)} ${esc(it.unitName||'')}${bn(it)?`<div class="cg" style="font-size:12px">+${f(bn(it))} بونص</div>`:''}</div></button>`).join('')}</div>`:''}`};

const vInv=id=>()=>{const p=arr(S.purchases).find(x=>x.id===id);if(!p)return hdr()+'<div class="pad mu">القائمة غير موجودة</div>';
  const u=img(p);
  return hdr()+`<div style="font-size:26px;font-weight:700">${esc(p.supplierName||'بدون مجهز')}</div>
  <div class="mu">${dt(p.ts)} · قائمة رقم ${esc(p.listNum??'—')} · ${p.type==='return'?'استرجاع':p.pay==='credit'?'آجل':'نقد'}${p.employeeName?' · '+esc(p.employeeName):''}</div>
  <div class="big" style="margin:14px 0 14px">${f(p.total)} <span style="font-size:18px" class="mu">${esc(cur())}</span></div>
  ${p.discount?`<div class="mu" style="margin:-8px 0 12px">خصم القائمة ${f(p.discount)}</div>`:''}
  ${u?`<div class="paper"><img src="${esc(u)}" data-a="zoom" alt="صورة القائمة"></div><button class="btn" data-a="save" data-id="${esc(id)}">حفظ الصورة</button>`:'<div class="g pad mu">لا توجد صورة محفوظة لهذه القائمة</div>'}
  <h2 style="font-size:18px">المواد</h2><div class="g sc"><table><tr><th>المادة</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>الانتهاء</th></tr>${(p.items||[]).map(it=>`<tr><td>${esc(it.name)}</td><td>${f(it.qty)} ${esc(it.unitName||'')}${bn(it)?`<br><span class="cg">+${f(bn(it))} بونص</span>`:''}</td><td>${f(it.buyPrice)}</td><td>${f(it.total)}</td><td>${esc(it.expiry||'—')}</td></tr>`).join('')}</table></div>`};

const vSup=id=>()=>{const s=arr(S.suppliers).find(x=>x.id===id);if(!s)return hdr()+'<div class="pad mu">المجهز غير موجود</div>';
  const E=[];
  if(+s.openingDebt)E.push({ts:0,t:'دين افتتاحي',d:+s.openingDebt});
  arr(S.purchases).filter(p=>p.supplierId===id).forEach(p=>{const rt=p.type==='return';
    E.push({ts:p.ts,t:`قائمة ${p.listNum??'—'} · ${rt?'استرجاع':'شراء'}${p.pay==='credit'?'':' (نقد)'}`,d:p.pay==='credit'?(rt?-1:1)*(+p.total||0):0,a:+p.total||0,bal:p.debtAfter,id:p.id})});
  arr(S.payments).filter(p=>p.supplierId===id&&p.kind==='payment').forEach(p=>E.push({ts:p.ts,t:'تسديد'+(p.discount?` + خصم ${f(p.discount)}`:''),d:-((+p.amount||0)+(+p.discount||0)),a:+p.amount||0,bal:p.debtAfter}));
  E.sort((a,b)=>a.ts-b.ts);let run=0;E.forEach(e=>{run=e.bal!=null?+e.bal:run+e.d;e.run=run});
  const R=E.slice().reverse();
  return hdr()+`<div style="font-size:26px;font-weight:700">${esc(s.name)}</div>
  <div style="margin:14px 0"><div class="mu">الدين الحالي</div><div class="big ${(+s.debt||0)>0?'cr':'cg'}">${f(s.debt)} <span style="font-size:18px" class="mu">${esc(cur())}</span></div></div>
  ${E.length>1?`<div class="g pad">${spark(E.map(e=>e.run))}<div class="ch"><span>الآن</span><span>تطور الدين</span></div></div>`:''}
  <h2 style="font-size:18px">كشف الحساب</h2>
  <div class="g">${R.map(e=>{const el=e.id?'button':'div';return `<${el} class="r" ${e.id?`data-a="inv" data-id="${esc(e.id)}"`:''}><div class="b"><div class="n">${esc(e.t)}</div><div class="mu">${e.ts?dt(e.ts):'—'}${e.d?` · <span class="${e.d>0?'cr':'cg'}">${e.d>0?'زيادة':'نقصان'} ${f(Math.abs(e.d))}</span>`:e.a?` · ${f(e.a)}`:''}</div></div><div class="v">${f(e.run)}<div class="mu" style="font-size:11px;font-weight:400">الدين بعدها</div></div></${el}>`}).join('')||'<div class="pad mu">لا حركات</div>'}</div>`};

function show(keep){const fn=stack[stack.length-1],sh=$('#sh'),st=keep?sh.scrollTop:0;
  document.body.classList.toggle('so',!!fn);if(fn){$('#shc').innerHTML=fn();sh.scrollTop=st}}
const push=fn=>{stack.push(fn);show()};

async function save(id){const p=arr(S.purchases).find(x=>x.id===id),u=p&&img(p);if(!u)return;
  try{const b=await(await fetch(u)).blob(),F=new File([b],'قائمة-'+(p.listNum||id)+'.jpg',{type:b.type||'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[F]})){await navigator.share({files:[F]});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=F.name;a.click()}
  catch(e){if(e.name!=='AbortError')window.open(u,'_blank')}}

/* الأحداث */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a==='prod'||a==='inv'||a==='sup'){ld('purchases');ld('payments')}
  if(a==='prod')push(vProd(id));else if(a==='inv')push(vInv(id));else if(a==='sup')push(vSup(id));
  else if(a==='back'){stack.pop();show()}
  else if(a==='per'){per=+id;rRep()}else if(a==='mr'){lim_.r=40;rRep()}
  else if(a==='ms'){lim_.s+=60;rStk()}else if(a==='mp'){lim_.p+=30;rPur()}
  else if(a==='flt'){flt=id;document.querySelectorAll('[data-a=flt]').forEach(b=>b.classList.toggle('on',b===t));lim_.s=40;rStk()}
  else if(a==='go')$('#'+id).scrollIntoView({behavior:'smooth',block:'start'});
  else if(a==='zoom')t.classList.toggle('z');
  else if(a==='tab')gt(id);
  else if(a==='ig'){const l=ign(),i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);setIgn(l);NEED.forEach(x=>x.ig=l.includes(x.p._k));NEED.sort(ns);rNeed()}
  else if(a==='save')save(id)});
$('#qs').oninput=e=>{qs=e.target.value;lim_.s=40;rStk()};
$('#qp').oninput=e=>{qp=e.target.value;lim_.p=15;rPur()};

/* الاتصال الحي */
const LD={},ld=c=>{if(LD[c])return;LD[c]=1;db.ref('pos/'+c).on('value',s=>{S[c]=s.val()||{};LD[c]=2;mark()})};
const TB=['st','su','nd','pu','sk'],N=TB.length,VP=$('.vp'),TK=$('.trk'),TBN=$('.tb'),BT=[...TBN.querySelectorAll('button')],PGS=[...TK.children],IND=document.createElement('i');
let cT='st',P=0,V=0,BZ=0,PD=0,tg=0,raf=0,hs=[],x0=0,y0=0,p0=0,lk=0,gb=0,W=1,cK=0;
IND.className='ind';TBN.prepend(IND);
const rbd=o=>1-1/(o*.55+1),cl=x=>x<0?-rbd(-x):x>N-1?N-1+rbd(x-N+1):x;
function ap(x){P=x;const c=cl(x),k=Math.round(Math.min(Math.max(x,0),N-1));
  TK.style.transform='translate3d('+c*20+'%,0,0)';IND.style.transform='translate3d('+(-c*100)+'%,0,0)';
  if(k!==cK){cK=k;BT.forEach((b,i)=>b.classList.toggle('on',i===k))}}
function done(){BZ=0;if(PD){PD=0;all()}}
function go(t){t=Math.max(0,Math.min(N-1,t));tg=t;cT=TB[t];cancelAnimationFrame(raf);BZ=1;
  if(t===1||t===3){ld('purchases');ld('payments')}
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){V=0;ap(t);return done()}
  const w=15,A=P-t,B=V+w*A,s0=performance.now();
  const st=n=>{const s=Math.max(0,(n-s0)/1000),e=Math.exp(-w*s),x=t+(A+B*s)*e,v=(B-w*(A+B*s))*e;
    if(s>1.5||(Math.abs(x-t)<5e-4&&Math.abs(v)<.01)){V=0;ap(t);return done()}
    V=v;ap(x);raf=requestAnimationFrame(st)};
  raf=requestAnimationFrame(st)}
function gt(id){const i=TB.indexOf(id);if(i<0)return;if(i===tg&&!BZ){PGS[i].scrollTo({top:0,behavior:'smooth'});return}go(i)}
VP.addEventListener('touchstart',e=>{if(stack.length||e.touches.length>1)return;const t=e.touches[0];
  x0=t.clientX;y0=t.clientY;lk=0;W=VP.clientWidth||1;gb=BZ?1:0;if(BZ)cancelAnimationFrame(raf);
  p0=P;V=0;hs=[[performance.now(),P]]},{passive:true});
VP.addEventListener('touchmove',e=>{if(!hs.length||lk===2)return;const t=e.touches[0];
  if(!lk){const a=Math.abs(t.clientX-x0),b=Math.abs(t.clientY-y0);if(a<7&&b<7)return;
    if(a>b){lk=1;BZ=1;x0=t.clientX;p0=P;TK.classList.add('dg')}else{lk=2;return}}
  const n=performance.now(),p=p0+(t.clientX-x0)/W;ap(p);hs.push([n,p]);while(hs.length>2&&n-hs[0][0]>100)hs.shift()},{passive:true});
function fin(){TK.classList.remove('dg');
  if(lk===1){const n=performance.now(),h=hs[0],l=hs[hs.length-1],dt=(l[0]-h[0])/1000,
      v=n-l[0]<90&&dt>.008?(l[1]-h[1])/dt:0,b=Math.round(p0);
    V=v;go(Math.max(b-1,Math.min(b+1,Math.round(P+v*.2))))}
  else if(gb)go(tg);
  hs=[];lk=0;gb=0}
VP.addEventListener('touchend',fin,{passive:true});VP.addEventListener('touchcancel',fin,{passive:true});
let tm,first=true;
function rSks(){const L=Object.values(PM),z=L.filter(p=>(+p.stockBase||0)<=0).length,lo=L.filter(p=>(+p.stockBase||0)>0&&(+p.stockBase||0)<=lim()*bf(p)).length,ok=L.length-z-lo,n=L.length||1;
  $('#sks').innerHTML=`<div class="g pad"><div class="stb"><i style="width:${ok/n*100}%;background:var(--gr)"></i><i style="width:${lo/n*100}%;background:var(--or)"></i><i style="width:${z/n*100}%;background:var(--rd)"></i></div><div class="ch"><span class="cg">متوفر ${ok}</span><span style="color:var(--or)">ناقص ${lo}</span><span class="cr">معدوم ${z}</span></div></div><div style="height:12px"></div>`}
function all(){if(BZ){PD=1;return}prep();rRep();rStk();rSks();rPur();rSup();if(stack.length)show(1);
  $('#dot').classList.add('on');$('#sy').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(S.settings&&S.settings.pharmacyName)$('#ttl').textContent=S.settings.pharmacyName;
  if(first&&LD.products===2){first=false;document.body.classList.add('rd','fr');$('#ld').classList.add('fd');setTimeout(()=>{$('#ld').remove();document.body.classList.remove('fr')},1600)}}
const mark=()=>{clearTimeout(tm);tm=setTimeout(all,150)};
function attach(){
  db.ref('pos/settings/app').on('value',s=>{S.settings=s.val();mark()});
  ld('products');ld('suppliers');ld('sales');
  setTimeout(()=>{ld('purchases');ld('payments')},2500);
}
firebase.auth().onAuthStateChanged(u=>{if(u)attach()});
firebase.auth().signInAnonymously().catch(e=>{$('#ld').innerHTML='<div style="padding:24px;text-align:center;color:var(--rd)">تعذر الاتصال: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
